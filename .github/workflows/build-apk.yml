name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: APK kompilieren
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Native Bibliotheken prüfen
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep "\.so" || true

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: MoCam-APK
          path: app/build/outputs/apk/debug/*.apk

      # Neueste Version immer unter derselben Adresse (QR-Code im Outro):
      # https://github.com/MoManufaktur/MoCam/releases/latest/download/MoCam.apk
      - name: Als neueste Version veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk MoCam.apk
          VERSION=1.1.${{ github.run_number }}
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MoCam.apk --target "${{ github.sha }}" --latest \
            --title "MoCam $VERSION" \
            --notes "Neueste Version von MoCam ($VERSION). APK herunterladen und installieren. Kostenlos & Open Source – unterstützt das Projekt gern über den Spenden-Button in der App."
